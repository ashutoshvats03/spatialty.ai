[project]
name = "spatialty-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ashutoshvats03", email = "142529686+ashutoshvats03@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "asgiref==3.8.1",
    "django==5.1.4",
    "django-cors-headers==4.0.0",
    "django-ratelimit==4.1.0",
    "djangorestframework==3.14.0",
    "djangorestframework-simplejwt==5.5.1",
    "gunicorn==23.0.0",
    "httpx==0.28.1",
    "numpy==2.1.0",
    "pandas==3.0.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.1.1",
    "requests==2.32.3",
    "setuptools==80.9.0",
    "sqlparse==0.5.3",
    "upstash-redis>=1.8.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
spatialty-backend = "spatialty_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
